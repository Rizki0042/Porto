<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Admin</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .navbar {
        background-color: darkred;
        color: white;

        padding: 20px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar h2 {
        font-size: 24px;
      }

      .navbar a {
        color: white;
        text-decoration: none;
      }

      .container {
        width: 90%;
        max-width: 1100px;

        margin: 40px auto;
      }

      .welcome {
        margin-bottom: 30px;
      }

      .welcome h1 {
        margin-bottom: 8px;
      }

      .welcome p {
        color: #777;
      }

      .stats {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 20px;

        margin-bottom: 30px;
      }

      .card {
        background-color: white;

        padding: 25px;

        border-radius: 15px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        color: #777;

        margin-bottom: 10px;
      }

      .number {
        font-size: 40px;

        font-weight: bold;

        color: darkred;
      }

      .menu {
        display: flex;
        gap: 15px;

        margin-top: 20px;
      }

      .menu a {
        background-color: darkred;

        color: white;

        text-decoration: none;

        padding: 12px 18px;

        border-radius: 8px;
      }

      .menu a:hover {
        background-color: #8b0000;
      }

      .latest-section {
    background-color: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

    margin-bottom: 30px;
}

.section-title {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}

.section-title h2 {
    color: #333;
}

.section-title a {
    color: darkred;

    text-decoration: none;

    font-weight: bold;
}

.contact-item {
    border-bottom: 1px solid #eee;

    padding: 15px 0;
}

.contact-item:last-child {
    border-bottom: none;
}

.contact-header {
    display: flex;

    justify-content: space-between;

    margin-bottom: 8px;
}

.contact-name {
    font-weight: bold;
}

.contact-email {
    color: #777;

    font-size: 14px;
}

.contact-message {
    color: #555;

    line-height: 1.5;
}

.contact-date {
    color: #999;

    font-size: 12px;

    margin-top: 8px;
}

.loading {
    color: #777;

    text-align: center;

    padding: 20px;
}


/* RESPONSIVE */

@media (max-width: 600px) {

    .navbar {
        padding: 20px;
    }

    .container {
        width: 92%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .menu {
        flex-direction: column;
    }

    .contact-header {
        flex-direction: column;

        gap: 5px;
    }

}
    </style>
  </head>

  <body>
    <nav class="navbar">
      <h2>Admin Dashboard</h2>

      <a href="index.html"> Kembali ke Website </a>
    </nav>

    <main class="container">
      <div class="welcome">
        <h1>Dashboard</h1>

        <p>Selamat datang di halaman admin website.</p>
      </div>

      <section class="stats">
        <div class="card">
          <h3>Total Pesan</h3>

          <div id="total-contact" class="number">-</div>
        </div>

        <div class="card">
          <h3>Status</h3>

          <div class="number">Aktif</div>
        </div>
      </section>

      <section class="latest-section">
        <div class="section-title">
          <h2>Pesan Terbaru</h2>

          <a href="admin.html"> Lihat Semua </a>
        </div>

        <div id="latest-contact">
          <p class="loading">Loading...</p>
        </div>
      </section>

      <div class="menu">
        <a href="admin.html"> Kelola Contact </a>

        <a href="index.html#contact"> Lihat Website </a>
      </div>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
