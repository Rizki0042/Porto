<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        h1 {
            color: darkred;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .table-container {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: darkred;
            color: white;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Contact Messages</h1>

    <p class="description">
        Daftar pesan yang dikirim melalui website.
    </p>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Pesan</th>
                    <th>Tanggal</th>
                </tr>
            </thead>

            <tbody id="contact-table">

                <tr>
                    <td colspan="5" class="loading">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <script src="admin.js"></script>

</body>

</html>
