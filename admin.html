<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin - Contact</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 40px;
      }

      h1 {
        color: darkred;
        margin-bottom: 10px;
      }

      .description {
        color: #666;
        margin-bottom: 30px;
      }

      .table-container {
        background-color: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      th {
        background-color: darkred;
        color: white;
      }

      tr:hover {
        background-color: #f9f9f9;
      }

      .loading {
        text-align: center;
        padding: 20px;
      }

      .delete-button {
        background-color: darkred;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
      }

      .delete-button:hover {
        background-color: #8b0000;
      }

      .edit-button,
      .delete-button {
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin: 2px;
      }

      .edit-button {
        background-color: #555;
      }

      .edit-button:hover {
        background-color: #333;
      }

      .delete-button {
        background-color: darkred;
      }

      .delete-button:hover {
        background-color: #8b0000;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;

        left: 0;
        top: 0;

        width: 100%;
        height: 100%;

        background-color: rgba(0, 0, 0, 0.5);

        justify-content: center;
        align-items: center;
      }

      .modal-content {
        width: 90%;
        max-width: 550px;

        background-color: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 25px;
      }

      .modal-header h2 {
        color: darkred;
      }

      .close-button {
        border: none;
        background: none;

        font-size: 30px;

        cursor: pointer;

        color: #555;
      }

      .close-button:hover {
        color: darkred;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;

        margin-bottom: 8px;

        font-weight: bold;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 15px;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;

        border-color: darkred;
      }

      .modal-actions {
        display: flex;

        justify-content: flex-end;

        gap: 10px;

        margin-top: 25px;
      }

      .cancel-button,
      .save-button {
        border: none;

        padding: 10px 18px;

        border-radius: 7px;

        cursor: pointer;

        font-weight: bold;
      }

      .cancel-button {
        background-color: #ddd;

        color: #333;
      }

      .save-button {
        background-color: darkred;

        color: white;
      }

      .save-button:hover {
        background-color: #8b0000;
      }
    </style>
  </head>

  <body>
    <h1>Contact Messages</h1>

    <p class="description">Daftar pesan yang dikirim melalui website.</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Email</th>
            <th>Pesan</th>
            <th>Tanggal</th>
            <th>Aksi</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="contact-table">
          <tr>
            <td colspan="6" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
      <div id="edit-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Edit Contact</h2>

            <button class="close-button" onclick="closeModal()">&times;</button>
          </div>

          <form id="edit-form">
            <input type="hidden" id="edit-id" />

            <div class="form-group">
              <label for="edit-nama"> Nama </label>

              <input type="text" id="edit-nama" required />
            </div>

            <div class="form-group">
              <label for="edit-email"> Email </label>

              <input type="email" id="edit-email" required />
            </div>

            <div class="form-group">
              <label for="edit-pesan"> Pesan </label>

              <textarea id="edit-pesan" rows="5" required></textarea>
            </div>

            <div class="modal-actions">
              <button
                type="button"
                class="cancel-button"
                onclick="closeModal()"
              >
                Batal
              </button>

              <button type="submit" class="save-button">
                Simpan Perubahan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
