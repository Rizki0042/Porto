<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | HypeText</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #292929;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: darkred;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid rgba(139, 0, 0, 0.15);
            border-color: darkred;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: darkred;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8b0000;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #login-status {
            min-height: 20px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: darkred;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <p class="brand">HYPETEXT ADMIN</p>
        <h1>Selamat datang</h1>
        <p class="description">
            Masuk untuk mengelola pesan yang dikirim melalui website.
        </p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="login-button">
                Masuk
            </button>

            <p id="login-status" role="status" aria-live="polite"></p>
        </form>

        <a href="index.html" class="back-link">
            ← Kembali ke portfolio
        </a>
    </main>

    <script src="login.js"></script>
</body>
</html>
